<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - Cure Diet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #f0f2f5; direction: rtl; }
        .card { border-radius: 16px; border: none; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        .card-header { font-weight: 600; padding: 14px 20px; }
        .menu-item { border: 1px solid #e9ecef; border-radius: 12px; padding: 16px 20px; margin-bottom: 16px; background: #fff; cursor: pointer; transition: all 0.3s ease; }
        .menu-item:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.08); border-color: #e54750; }
        .day-item { border: 1px solid #e9ecef; border-radius: 10px; padding: 10px 15px; margin: 8px 0; background: #f8f9fa; }
        .meal-item { border: 1px solid #e9ecef; border-radius: 8px; padding: 4px 12px; margin: 3px 4px; background: #fff; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
        .btn-sm { padding: 4px 14px; font-size: 12px; border-radius: 8px; }
        .text-muted-small { font-size: 12px; color: #6c757d; }
        .border-right-menu { padding-right: 25px; border-right: 3px solid #e54750; margin: 12px 0 0; }
        .border-right-day { padding-right: 20px; border-right: 2px solid #28a745; margin: 8px 0 0; }
        .hidden-section { display: none; }
        .fade-in { animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .breadcrumb-nav { background: #fff; padding: 12px 0; border-bottom: 2px solid #e9ecef; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 15px rgba(0,0,0,0.05); }
        .breadcrumb-nav .btn-back { background: transparent; border: 2px solid #e9ecef; border-radius: 50px; padding: 6px 18px; font-weight: 500; font-size: 14px; transition: all 0.3s ease; color: #2c3e50; }
        .breadcrumb-nav .btn-back:hover { background: #e54750; color: #fff !important; border-color: #e54750; }
    </style>
</head>
<body>

<!-- ===== Breadcrumb ===== -->
<div class="breadcrumb-nav">
    <div class="container">
        <!-- ===== في الـ Header ===== -->
<div class="d-flex flex-wrap align-items-center justify-content-between mb-4">
    <h1 class="mb-0">⚙️ لوحة التحكم - Cure Diet</h1>
    <div class="d-flex gap-2">
        <a href="reports.html" class="btn btn-info btn-sm">📊 التقارير</a>
        <a href="index.html" class="btn btn-outline-primary btn-sm" target="_blank">👁️ عرض الموقع</a>
    </div>
</div>
    </div>
</div>

<div class="container py-4">

    <!-- ===== Step 1: قائمة المنيوات ===== -->
    <div id="stepMenus" class="fade-in">
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white fw-bold">➕ إضافة منيو جديد</div>
            <div class="card-body">
                <div class="row g-2">
                    <div class="col-md-4">
                        <input type="text" id="newMenuName" class="form-control" placeholder="اسم المنيو">
                    </div>
                    <div class="col-md-3">
                        <input type="text" id="newMenuIcon" class="form-control" placeholder="أيقونة (🥗)">
                    </div>
                    <div class="col-md-3">
                        <button class="btn btn-success w-100" onclick="addMenu()">➕ إضافة</button>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-secondary w-100" onclick="loadMenus()">🔄 تحديث</button>
                    </div>
                </div>
                <div id="addMessage" class="mt-2"></div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <span>📋 المنيوات</span>
                <span class="badge bg-light text-dark" id="menusCount">0</span>
            </div>
            <div class="card-body" id="menusList">
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2">جاري التحميل...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== Step 2: تفاصيل المنيو (أيام ووجبات) ===== -->
    <div id="stepMenuDetails" class="hidden-section fade-in">
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
                <span id="menuDetailsTitle">📋 تفاصيل المنيو</span>
                <button class="btn btn-sm btn-light" onclick="addDay()">+ إضافة يوم</button>
            </div>
            <div class="card-body" id="menuDetailsContent">
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2">جاري التحميل...</p>
                </div>
            </div>
        </div>
    </div>

</div>

<script src="admin.js"></script>

</body>
</html>
